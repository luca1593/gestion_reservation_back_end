spring:
  application:
    name: gsrt-dev
  datasource:
    url: ${SOPRING_DATASOURCE_url}
    username: ${SOPRING_DATASOURCE_USERNAME}
    password: ${SOPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    main:
      allow-circular-references: true
  jpa:
    database: MYSQL
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
      format_sql: true
      show_sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
server:
  error:
    whitelabel:
      enabled: false
  port: 8080

logging:
  level:
    org.springframework.web: INFO
    org.hibernate: ERROR